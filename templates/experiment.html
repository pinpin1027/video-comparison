<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b10">
    <meta name="description" content="左右滑动、同步播放的视频实验对比。">
    <title>Video Comparison</title>
    <link rel="stylesheet" href="../../assets/site.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../../"><span class="brand-mark">VC</span><span>VIDEO COMPARISON</span></a>
      <span class="header-note">FRAME-SYNCHRONIZED REVIEW</span>
    </header>

    <main class="comparison-main">
      <a class="breadcrumb" href="../../">← 返回实验目录</a>
      <section class="comparison-intro">
        <div>
          <p class="kicker">DRAGGABLE BEFORE / AFTER</p>
          <h1 id="experiment-title">正在加载实验…</h1>
          <p class="comparison-description" id="experiment-description"></p>
        </div>
        <div class="case-picker">
          <label for="case-select">选择案例</label>
          <select id="case-select" aria-label="选择视频案例"></select>
        </div>
      </section>

      <section class="comparison-shell" aria-label="视频左右滑动对比播放器">
        <div class="video-stage" id="video-stage">
          <video class="video-layer before" id="before-video" muted playsinline loop preload="metadata"></video>
          <video class="video-layer after" id="after-video" muted playsinline loop preload="metadata"></video>
          <span class="stage-label left" id="left-stage-label">Before</span>
          <span class="stage-label right" id="right-stage-label">After</span>
          <div class="split-line" aria-hidden="true"></div>
          <button class="split-handle" id="split-handle" type="button" aria-label="拖动左右对比分割线" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></button>
          <p class="stage-message" id="stage-message">正在读取实验清单…</p>
        </div>
        <div class="controls">
          <button class="control-button" id="play-button" type="button">播放</button>
          <input class="timeline" id="timeline" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放进度">
          <span class="time-label" id="time-label">0:00.0 / 0:00.0</span>
          <button class="control-button" id="mute-button" type="button">开启声音</button>
        </div>
        <div class="case-metadata">
          <div class="meta-side" id="left-meta"></div>
          <div class="meta-side" id="right-meta"></div>
        </div>
      </section>

    </main>

    <footer class="site-footer"><span>VIDEO COMPARISON</span><span>Drag the divider · inspect the difference.</span></footer>
    <script src="../../assets/comparison.js" defer></script>
  </body>
</html>
